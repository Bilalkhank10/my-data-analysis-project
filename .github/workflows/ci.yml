name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@n4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck (strict)
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fiverr-niche-fetcher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Fetcher copy sync check
        run: python ../scripts/sync_fiverr_fetcher.py --check
      - name: Unit tests
        run: python -m pytest tests/ -q

  mcp-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fiverr-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: MCP server import + tool manifest
        run: |
          python -c "import mcp_server; names = [t['name'] for t in mcp_server.TOOLS]; assert names == ['search_fiverr_gigs', 'fetch_gig_details', 'crawl_fiverr_niche'], names; print('MCP tools OK:', names)"
